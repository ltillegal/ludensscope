<!DOCTYPE html>
<html lang="ru"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — страница не найдена · LudensScope</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#01141b">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; }
    .nf-card { max-width: 560px; text-align: center; }
    .nf-card img { width: 46px; height: 46px; }
    .nf-code { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; color: var(--accent); margin: 18px 0 10px; }
    .nf-card h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 14px; letter-spacing: -.03em; }
    .nf-card p { color: var(--dim); margin: 0 0 12px; }
    .nf-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-card">
      <img src="/assets/logo.png" alt="LudensScope">
      <p class="nf-code">404</p>
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела. Плагин и релизы живут на главной.</p>
      <p><span lang="en">This page does not exist — head back to the home page.</span></p>
      <div class="nf-actions">
        <a class="btn btn-primary" href="/">На главную</a>
        <a class="btn btn-ghost" href="/en/">English</a>
      </div>
    </div>
  </main>
</body>
</html>
