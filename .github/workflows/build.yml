name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUDENSCOPE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test loudness
        run: ctest --test-dir build --output-on-failure -C Release -R "^loudness$"

      - name: Test spectrum
        run: ctest --test-dir build --output-on-failure -C Release -R "^spectrum$"

      - name: Test UI snapshot (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure -C Release -R "^ui_snapshot$"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ludensscope-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            build/LudensScope_artefacts/Release/VST3/LudensScope.vst3
            build/LudensScope_artefacts/Release/AU/LudensScope.component
