name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${{ inputs.tag }}" ]]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          echo "LUDENSCOPE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUDENSCOPE_VERSION="$LUDENSCOPE_VERSION" $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf pkgroot
          mkdir -p pkgroot/DEBIAN pkgroot/usr/lib/vst3 pkgroot/usr/lib/clap \
                   pkgroot/usr/bin pkgroot/usr/share/applications \
                   pkgroot/usr/share/icons/hicolor/256x256/apps
          cp -R build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 pkgroot/usr/lib/vst3/
          cp -R build/LudensScope_artefacts/Release/CLAP/LudensScope.clap pkgroot/usr/lib/clap/
          install -Dm755 build/LudensScope_artefacts/Release/Standalone/LudensScope pkgroot/usr/bin/ludensscope
          install -Dm644 Source/assets/ludens_logo.png pkgroot/usr/share/icons/hicolor/256x256/apps/ludensscope.png
          cat > pkgroot/usr/share/applications/ludensscope.desktop <<EOF
          [Desktop Entry]
          Name=LudensScope
          Comment=Stereo audio analyzer
          Exec=ludensscope
          Icon=ludensscope
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF
          cat > pkgroot/DEBIAN/control <<EOF
          Package: ludensscope
          Version: ${LUDENSCOPE_VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: ltillegal <alek.ludens@gmail.com>
          Depends: libasound2 | libasound2t64, libcurl4 | libcurl4t64, libfreetype6, libx11-6, libxext6, libxinerama1, libxrandr2, libxrender1, libgl1
          Description: Stereo audio analyzer (VST3, CLAP, standalone)
           Spectrum, BS.1770 loudness, true peak, ORIG/REF reference, gain staging and VU.
          EOF
          dpkg-deb --build --root-owner-group pkgroot LudensScope-linux.deb

      - name: Package (macOS .pkg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for bundle in build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 \
                        build/LudensScope_artefacts/Release/AU/LudensScope.component \
                        build/LudensScope_artefacts/Release/CLAP/LudensScope.clap \
                        build/LudensScope_artefacts/Release/AAX/LudensScope.aaxplugin \
                        build/LudensScope_artefacts/Release/Standalone/LudensScope.app; do
            if [ -e "$bundle" ]; then
              codesign --force --deep --sign - "$bundle"
            fi
          done
          rm -rf pkgroot
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 \
                   pkgroot/Library/Audio/Plug-Ins/Components \
                   pkgroot/Library/Audio/Plug-Ins/CLAP \
                   "pkgroot/Library/Application Support/Avid/Audio/Plug-Ins" \
                   pkgroot/Applications
          cp -R build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R build/LudensScope_artefacts/Release/AU/LudensScope.component pkgroot/Library/Audio/Plug-Ins/Components/
          cp -R build/LudensScope_artefacts/Release/CLAP/LudensScope.clap pkgroot/Library/Audio/Plug-Ins/CLAP/
          cp -R build/LudensScope_artefacts/Release/AAX/LudensScope.aaxplugin "pkgroot/Library/Application Support/Avid/Audio/Plug-Ins/"
          cp -R build/LudensScope_artefacts/Release/Standalone/LudensScope.app pkgroot/Applications/
          pkgbuild --root pkgroot --identifier com.ltillegal.ludensscope \
                   --version "$LUDENSCOPE_VERSION" --install-location / LudensScope-macos.pkg

      - name: Package (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = "C:\Program Files\NSIS\makensis.exe" }
          $script = @'
          !include "MUI2.nsh"
          Name "LudensScope"
          OutFile "LudensScope-windows.exe"
          InstallDir "$COMMONFILES64\VST3"
          RequestExecutionLevel admin
          Unicode true
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"
          Section "VST3" SecVst3
            SetOutPath "$INSTDIR"
            File /r "build\LudensScope_artefacts\Release\VST3\LudensScope.vst3"
            WriteUninstaller "$INSTDIR\LudensScope-uninstall.exe"
          SectionEnd
          Section "CLAP" SecClap
            SetOutPath "$COMMONFILES64\CLAP"
            File /r "build\LudensScope_artefacts\Release\CLAP\LudensScope.clap"
          SectionEnd
          Section "AAX (Pro Tools)" SecAax
            SetOutPath "$COMMONFILES64\Avid\Audio\Plug-Ins"
            File /r "build\LudensScope_artefacts\Release\AAX\LudensScope.aaxplugin"
          SectionEnd
          Section "Standalone" SecStandalone
            SetOutPath "$PROGRAMFILES64\LudensScope"
            File "build\LudensScope_artefacts\Release\Standalone\LudensScope.exe"
            CreateShortcut "$SMPROGRAMS\LudensScope.lnk" "$PROGRAMFILES64\LudensScope\LudensScope.exe"
          SectionEnd
          Section "Uninstall"
            Delete "$INSTDIR\LudensScope-uninstall.exe"
            RMDir /r "$INSTDIR\LudensScope.vst3"
            Delete "$COMMONFILES64\CLAP\LudensScope.clap"
            RMDir /r "$COMMONFILES64\Avid\Audio\Plug-Ins\LudensScope.aaxplugin"
            RMDir /r "$PROGRAMFILES64\LudensScope"
            Delete "$SMPROGRAMS\LudensScope.lnk"
          SectionEnd
          '@
          Set-Content -Path installer.nsi -Value $script -Encoding UTF8
          & $nsis installer.nsi
          if (!(Test-Path LudensScope-windows.exe)) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: LudensScope-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          python3 scripts/release-notes.py "${{ inputs.tag || github.ref_name }}" > release-notes.md
          head -30 release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*
