name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${{ inputs.tag }}" ]]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          echo "LUDENSCOPE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUDENSCOPE_VERSION="$LUDENSCOPE_VERSION" $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf pkgroot
          mkdir -p pkgroot/DEBIAN pkgroot/usr/lib/vst3
          cp -R build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 pkgroot/usr/lib/vst3/
          cat > pkgroot/DEBIAN/control <<EOF
          Package: ludensscope
          Version: ${LUDENSCOPE_VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: ltillegal <0eskimo0@gmail.com>
          Depends: libasound2 | libasound2t64, libcurl4 | libcurl4t64, libfreetype6, libx11-6, libxext6, libxinerama1, libxrandr2, libxrender1, libgl1
          Description: Stereo audio analyzer VST3
           Spectrum, BS.1770 loudness, true peak, reference A-D, gain staging and VU.
          EOF
          dpkg-deb --build --root-owner-group pkgroot LudensScope-linux.deb

      - name: Package (macOS .pkg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for bundle in build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 \
                        build/LudensScope_artefacts/Release/AU/LudensScope.component; do
            codesign --force --deep --sign - "$bundle"
          done
          rm -rf pkgroot
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components
          cp -R build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R build/LudensScope_artefacts/Release/AU/LudensScope.component pkgroot/Library/Audio/Plug-Ins/Components/
          pkgbuild --root pkgroot --identifier com.ltillegal.ludensscope \
                   --version "$LUDENSCOPE_VERSION" --install-location / LudensScope-macos.pkg

      - name: Package (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = "C:\Program Files\NSIS\makensis.exe" }
          $script = @'
          !include "MUI2.nsh"
          Name "LudensScope"
          OutFile "LudensScope-windows.exe"
          InstallDir "$COMMONFILES64\VST3"
          RequestExecutionLevel admin
          Unicode true
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"
          Section "LudensScope" SecMain
            SetOutPath "$INSTDIR"
            File /r "build\LudensScope_artefacts\Release\VST3\LudensScope.vst3"
            WriteUninstaller "$INSTDIR\LudensScope-uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "$INSTDIR\LudensScope-uninstall.exe"
            RMDir /r "$INSTDIR\LudensScope.vst3"
          SectionEnd
          '@
          Set-Content -Path installer.nsi -Value $script -Encoding UTF8
          & $nsis installer.nsi
          if (!(Test-Path LudensScope-windows.exe)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: LudensScope-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
