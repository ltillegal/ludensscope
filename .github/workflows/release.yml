name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev zip

      - name: Version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${{ inputs.tag }}" ]]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          echo "LUDENSCOPE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUDENSCOPE_VERSION="$LUDENSCOPE_VERSION" $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/LudensScope_artefacts/Release/VST3
          zip -r "$GITHUB_WORKSPACE/LudensScope-linux.zip" LudensScope.vst3

      # Komi Store (and most Linux users) prefer a real package over a zip.
      - name: Package (Linux deb)
        if: runner.os == 'Linux'
        run: |
          PKG="ludensscope_${LUDENSCOPE_VERSION}_amd64"
          mkdir -p "deb/$PKG/DEBIAN" "deb/$PKG/usr/lib/vst3"
          cp -R build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 "deb/$PKG/usr/lib/vst3/"
          cat > "deb/$PKG/DEBIAN/control" <<EOF
          Package: ludensscope
          Version: ${LUDENSCOPE_VERSION}
          Architecture: amd64
          Maintainer: AlekLudens <0eskimo0@gmail.com>
          Section: sound
          Priority: optional
          Description: LudensScope - stereo spectrum, loudness and scope analyser (VST3)
           Minimalist stereo analyser: spectrum, loudness to ITU-R BS.1770-4,
           true peak, vectorscope, oscilloscope and reference.
          EOF
          dpkg-deb --build --root-owner-group "deb/$PKG" "$GITHUB_WORKSPACE/${PKG}.deb"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          for bundle in build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 \
                        build/LudensScope_artefacts/Release/AU/LudensScope.component; do
            codesign --force --deep --sign - "$bundle"
          done
          mkdir -p dist
          cp -R build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 dist/
          cp -R build/LudensScope_artefacts/Release/AU/LudensScope.component dist/
          cd dist
          zip -r "$GITHUB_WORKSPACE/LudensScope-macos.zip" LudensScope.vst3 LudensScope.component

      # Installable .pkg: drops VST3 + AU where every DAW looks for them.
      - name: Package (macOS pkg)
        if: runner.os == 'macOS'
        run: |
          pkgroot="$RUNNER_TEMP/pkgroot"
          mkdir -p "$pkgroot/Library/Audio/Plug-Ins/VST3" \
                   "$pkgroot/Library/Audio/Plug-Ins/Components"
          cp -R build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 \
                "$pkgroot/Library/Audio/Plug-Ins/VST3/"
          cp -R build/LudensScope_artefacts/Release/AU/LudensScope.component \
                "$pkgroot/Library/Audio/Plug-Ins/Components/"
          pkgbuild --root "$pkgroot" \
            --identifier local.ludensscope.installer \
            --version "$LUDENSCOPE_VERSION" \
            --install-location / \
            --ownership recommended \
            "$GITHUB_WORKSPACE/LudensScope-${LUDENSCOPE_VERSION}-macos.pkg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/LudensScope_artefacts/Release/VST3/LudensScope.vst3 `
                           -DestinationPath LudensScope-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            LudensScope-*.zip
            LudensScope-*.pkg
            ludensscope_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/LudensScope-*.zip
            artifacts/LudensScope-*.pkg
            artifacts/ludensscope_*.deb
            artifacts/SHA256SUMS.txt
